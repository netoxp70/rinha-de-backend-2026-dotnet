name: rinha-backend-2026

services:
  api1: &api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      UDS_PATH: "/run/uds/api1.sock"
      DOTNET_GCHeapCount: "1"
      DOTNET_PROCESSOR_COUNT: "1"
      DOTNET_ThreadPool_UnfairSemaphoreSpinLimit: "0"
      TP_MIN_WORKERS: "4"
      TP_MAX_WORKERS: "4"
      IVF_NPROBE: "2"
      IVF_BORDERLINE_NPROBE: "32"
      Q8_SCAN: "1"
      Q8_OVERFETCH: "20"
    volumes:
      - uds:/run/uds
    networks: [app]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "grep -q api1.sock /proc/net/unix || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.37"
          memory: "150MB"

  api2:
    <<: *api
    environment:
      UDS_PATH: "/run/uds/api2.sock"
      DOTNET_GCHeapCount: "1"
      DOTNET_PROCESSOR_COUNT: "1"
      DOTNET_ThreadPool_UnfairSemaphoreSpinLimit: "0"
      TP_MIN_WORKERS: "4"
      TP_MAX_WORKERS: "4"
      IVF_NPROBE: "2"
      IVF_BORDERLINE_NPROBE: "32"
      Q8_SCAN: "1"
      Q8_OVERFETCH: "20"
    healthcheck:
      test: ["CMD-SHELL", "grep -q api2.sock /proc/net/unix || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      api1:
        condition: service_started

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - uds:/run/uds
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.26"
          memory: "50MB"

volumes:
  uds:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  app:
    driver: bridge
