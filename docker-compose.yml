name: rinha-backend-2026

services:
  api1: &api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    cpuset: "0"
    security_opt:
      - seccomp=unconfined
    environment:
      UDS_PATH: "/run/uds/api1.sock"
      # ── GC ───────────────────────────────────────────────────────────
      DOTNET_GCHeapCount: "1"
      DOTNET_PROCESSOR_COUNT: "1"
      DOTNET_GCConserveMemory: "5"
      DOTNET_GCNoAffinitize: "1"
      # ── ThreadPool: 8 workers to absorb 50 VU burst ────────────────
      DOTNET_ThreadPool_UnfairSemaphoreSpinLimit: "0"
      TP_MIN_WORKERS: "8"
      TP_MAX_WORKERS: "8"
      # ── KNN: nprobe=1 + early-stop (reference config) ───────────────
      IVF_NPROBE: "1"
      IVF_BORDERLINE: "0"
      IVF_BORDERLINE_NPROBE: "4"
      IVF_EARLY_STOP_PCT: "25"
      Q8_SCAN: "1"
      Q8_OVERFETCH: "20"
    volumes:
      - uds:/run/uds
    networks: [app]
    restart: on-failure
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "grep -q api1.sock /proc/net/unix || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"

  api2:
    <<: *api
    cpuset: "1"
    security_opt:
      - seccomp=unconfined
    environment:
      UDS_PATH: "/run/uds/api2.sock"
      DOTNET_GCHeapCount: "1"
      DOTNET_PROCESSOR_COUNT: "1"
      DOTNET_GCConserveMemory: "5"
      DOTNET_GCNoAffinitize: "1"
      DOTNET_ThreadPool_UnfairSemaphoreSpinLimit: "0"
      TP_MIN_WORKERS: "8"
      TP_MAX_WORKERS: "8"
      IVF_NPROBE: "1"
      IVF_BORDERLINE: "0"
      IVF_BORDERLINE_NPROBE: "4"
      IVF_EARLY_STOP_PCT: "25"
      Q8_SCAN: "1"
      Q8_OVERFETCH: "20"
    healthcheck:
      test: ["CMD-SHELL", "grep -q api2.sock /proc/net/unix || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      api1:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "150MB"

  lb:
    image: nginx:1.30.1-alpine
    cpuset: "2,3"
    security_opt:
      - seccomp=unconfined
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - uds:/run/uds
    ports:
      - "9999:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "50MB"

volumes:
  uds:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  app:
    driver: bridge
