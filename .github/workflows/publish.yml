name: Build & Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rinha-de-backend-2026-dotnet

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update submission branch
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin submission
          git checkout submission

          cat > docker-compose.yml << EOF
          name: rinha-backend-2026

          services:
            api1: &api
              image: ${IMAGE}
              cpuset: "0"
              security_opt:
                - seccomp=unconfined
              environment:
                UDS_PATH: "/run/uds/api1.sock"
                DOTNET_GCHeapCount: "1"
                DOTNET_PROCESSOR_COUNT: "1"
                DOTNET_GCConserveMemory: "5"
                DOTNET_GCNoAffinitize: "1"
                DOTNET_ThreadPool_UnfairSemaphoreSpinLimit: "0"
                TP_MIN_WORKERS: "8"
                TP_MAX_WORKERS: "8"
                IVF_NPROBE: "1"
                IVF_BORDERLINE: "0"
                IVF_BORDERLINE_NPROBE: "4"
                IVF_EARLY_STOP_PCT: "25"
                Q8_SCAN: "1"
                Q8_OVERFETCH: "20"
              volumes:
                - uds:/run/uds
              networks: [app]
              restart: on-failure
              ulimits:
                memlock: -1
              healthcheck:
                test: ["CMD-SHELL", "grep -q api1.sock /proc/net/unix || exit 1"]
                interval: 3s
                timeout: 5s
                retries: 40
                start_period: 10s
              deploy:
                resources:
                  limits:
                    cpus: "0.45"
                    memory: "150MB"

            api2:
              <<: *api
              cpuset: "1"
              security_opt:
                - seccomp=unconfined
              environment:
                UDS_PATH: "/run/uds/api2.sock"
                DOTNET_GCHeapCount: "1"
                DOTNET_PROCESSOR_COUNT: "1"
                DOTNET_GCConserveMemory: "5"
                DOTNET_GCNoAffinitize: "1"
                DOTNET_ThreadPool_UnfairSemaphoreSpinLimit: "0"
                TP_MIN_WORKERS: "8"
                TP_MAX_WORKERS: "8"
                IVF_NPROBE: "1"
                IVF_BORDERLINE: "0"
                IVF_BORDERLINE_NPROBE: "4"
                IVF_EARLY_STOP_PCT: "25"
                Q8_SCAN: "1"
                Q8_OVERFETCH: "20"
              healthcheck:
                test: ["CMD-SHELL", "grep -q api2.sock /proc/net/unix || exit 1"]
                interval: 3s
                timeout: 5s
                retries: 40
                start_period: 10s
              depends_on:
                api1:
                  condition: service_started
              deploy:
                resources:
                  limits:
                    cpus: "0.45"
                    memory: "150MB"

            lb:
              image: nginx:1.30.1-alpine
              security_opt:
                - seccomp=unconfined
              volumes:
                - ./nginx.conf:/etc/nginx/nginx.conf:ro
                - uds:/run/uds
              ports:
                - "9999:9999"
              depends_on:
                api1:
                  condition: service_healthy
                api2:
                  condition: service_healthy
              networks: [app]
              deploy:
                resources:
                  limits:
                    cpus: "0.10"
                    memory: "50MB"

          volumes:
            uds:
              driver_opts:
                type: tmpfs
                device: tmpfs

          networks:
            app:
              driver: bridge
          EOF

          git add docker-compose.yml
          git diff --cached --quiet || git commit -m "submission: update image to ${{ github.sha }}"
          git push origin submission
